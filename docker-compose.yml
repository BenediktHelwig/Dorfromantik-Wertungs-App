# Entwicklung und Integrationstests (nicht für den Heimserver, siehe INSTALL.md).
# Start:  docker compose up -d --wait     ->  http://localhost:8081  (admin / Dorf-Test-Admin-2026!)
# Die Passwörter hier gelten nur für diesen Wegwerf-Container, der nur auf diesem Rechner erreichbar ist.
name: dorfromantik

services:
  # Baut die Vue-Oberfläche nach nextcloud-app/dorfromantik/js (Node ist dafür nicht auf dem Rechner nötig).
  frontend-build:
    image: node:22-alpine
    working_dir: /repo/nextcloud-app/dorfromantik
    command: sh -c "npm install --no-audit --no-fund && npm run build"
    volumes:
      - ./:/repo
      - frontend-modules:/repo/nextcloud-app/dorfromantik/node_modules

  nextcloud:
    image: nextcloud:31.0.5-apache
    depends_on:
      frontend-build:
        condition: service_completed_successfully
    # Docker legt den Ordner über dem App-Mount als root an, Nextcloud muss aber in custom_apps schreiben dürfen.
    entrypoint: ["sh", "-c", "mkdir -p /var/www/html/custom_apps && chown www-data:www-data /var/www/html/custom_apps && exec /entrypoint.sh apache2-foreground"]
    ports:
      - "127.0.0.1:8081:80"
    environment:
      SQLITE_DATABASE: nextcloud
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: Dorf-Test-Admin-2026!
      NEXTCLOUD_TRUSTED_DOMAINS: localhost
    volumes:
      - nextcloud-data:/var/www/html
      - ./nextcloud-app/dorfromantik:/var/www/html/custom_apps/dorfromantik:ro
      - ./nextcloud/hooks/post-installation:/docker-entrypoint-hooks.d/post-installation:ro
    healthcheck:
      # Apache startet erst nach den Hooks: Antwortet status.php, sind App und Testnutzer eingerichtet.
      test: ["CMD-SHELL", "curl -fs http://localhost/status.php | grep -q '\"installed\":true'"]
      interval: 5s
      timeout: 20s
      retries: 60
      start_period: 20s

volumes:
  nextcloud-data:
  frontend-modules:
